name: Garmin Weight Uploader (Drive → Garmin)

on:
  workflow_dispatch:
  schedule:
    # 매일 오전 0시 (KST)
    - cron: "0 15 * * *"
    # 매일 오후 12시 (KST)
    - cron: "0 3 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    # keepalive 스텝이 커밋을 푸시하려면 쓰기 권한 필요
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 공개 저장소는 60일간 커밋이 없으면 GitHub가 schedule 트리거를 자동 비활성화한다.
      # (실제로 2026-04-24 마지막 커밋 → 2026-06-23 이후 실행 중단됨)
      # 45일 이상 활동이 없으면 빈 커밋을 남겨 비활성화 카운터를 리셋한다.
      - name: Keepalive (prevent schedule auto-disable)
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          time_elapsed: "45"
          commit_message: "chore: keepalive to prevent scheduled workflow auto-disable"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install garth
          pip install garminconnect==0.3.2 readchar
          python - <<'PY'
          from importlib.metadata import version, PackageNotFoundError
          for p in ["garminconnect","garth","pandas","python-dateutil"]:
              try:
                  print(p, version(p))
              except PackageNotFoundError:
                  print(p, "not installed")
          PY

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Write Google Service Account JSON
        shell: bash
        run: |
          cat > sa.json <<'JSON'
          ${{ secrets.GDRIVE_SA_JSON }}
          JSON

      - name: Create rclone config (root_folder pinned)
        env:
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          cat > rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive.readonly
          service_account_file = ${PWD}/sa.json
          root_folder_id = ${FOLDER_ID}
          EOF

      - name: DEBUG - list remote
        env:
          RCLONE_CONFIG: ${{ github.workspace }}/rclone.conf
        run: |
          rclone lsl 'gdrive:' || true

      - name: Download CSVs from Drive (export Sheets→CSV)
        env:
          RCLONE_CONFIG: ${{ github.workspace }}/rclone.conf
        run: |
          set -e
          rclone copy 'gdrive:' . --drive-export-formats csv
          echo "Workspace files:"; ls -al
          echo "CSV files:"; ls -al *.csv || true
          (ls -t *.csv 2>/dev/null | head -n 1 | xargs -I{} sh -c 'echo ">>> {}"; head -n 5 "{}"') || true

      - name: Restore Garmin token from Secret
        env:
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
        run: |
          mkdir -p ~/.garminconnect
          echo "$GARMIN_TOKEN" | base64 -d > /tmp/garmin_token.zip
          unzip -o /tmp/garmin_token.zip -d ~/.garminconnect
          echo "✅ 토큰 복원 완료"
          ls -la ~/.garminconnect

      - name: Restore Garmin token cache (~/.garminconnect)
        id: restore_token
        uses: actions/cache/restore@v4
        with:
          path: ~/.garminconnect
          key: garmin-token-v2-${{ github.run_id }}
          restore-keys: |
            garmin-token-v2-

      - name: Upload to Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          # 로컬 garminconnect 폴더가 pip 설치 버전보다 우선되는 문제 방지
          mv garminconnect garminconnect_local_bak
          python GWU.py
          mv garminconnect_local_bak garminconnect

      - name: Save Garmin token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.garminconnect
          key: garmin-token-v2-${{ github.run_id }}
