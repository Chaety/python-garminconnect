name: Garmin Weight Uploader (Drive → Garmin)

on:
  workflow_dispatch:
    inputs:
      max_age:
        description: "Drive에서 받아올 파일의 최대 나이 (rclone --max-age). 전체 재동기화는 all"
        required: false
        default: "30d"
      since_days:
        description: "이 일수보다 오래된 측정은 업로드 생략. 전체 재동기화는 all"
        required: false
        default: "30"
  schedule:
    # 매일 오전 0시 (KST)
    - cron: "0 15 * * *"
    # 매일 오후 12시 (KST)
    - cron: "0 3 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    # keepalive 스텝이 커밋을 푸시하려면 쓰기 권한 필요
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 공개 저장소는 60일간 커밋이 없으면 GitHub가 schedule 트리거를 자동 비활성화한다.
      # (실제로 2026-04-24 마지막 커밋 → 2026-06-23 이후 실행 중단됨)
      # 45일 이상 활동이 없으면 빈 커밋을 남겨 비활성화 카운터를 리셋한다.
      # 이 저장소는 서드파티 액션이 차단돼 있어 외부 액션 대신 직접 구현한다.
      - name: Keepalive (prevent schedule auto-disable)
        env:
          THRESHOLD_DAYS: "45"
        run: |
          set -euo pipefail
          last_commit=$(git log -1 --format=%ct)
          elapsed_days=$(( ( $(date +%s) - last_commit ) / 86400 ))
          echo "마지막 커밋 이후 ${elapsed_days}일 경과 (임계값: ${THRESHOLD_DAYS}일)"
          if [ "$elapsed_days" -lt "$THRESHOLD_DAYS" ]; then
            echo "아직 keepalive 불필요"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent scheduled workflow auto-disable"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "keepalive 커밋 푸시 완료"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'garth>=0.5.17,<0.6.0'
          pip install garminconnect==0.3.2 readchar
          python - <<'PY'
          from importlib.metadata import version, PackageNotFoundError
          for p in ["garminconnect","garth","pandas","python-dateutil"]:
              try:
                  print(p, version(p))
              except PackageNotFoundError:
                  print(p, "not installed")
          PY

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Write Google Service Account JSON
        shell: bash
        run: |
          cat > sa.json <<'JSON'
          ${{ secrets.GDRIVE_SA_JSON }}
          JSON

      - name: Create rclone config (root_folder pinned)
        env:
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          cat > rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive.readonly
          service_account_file = ${PWD}/sa.json
          root_folder_id = ${FOLDER_ID}
          EOF

      - name: DEBUG - list remote
        env:
          RCLONE_CONFIG: ${{ github.workspace }}/rclone.conf
        run: |
          rclone lsl 'gdrive:' || true

      - name: Download CSVs from Drive (export Sheets→CSV)
        env:
          RCLONE_CONFIG: ${{ github.workspace }}/rclone.conf
          # 스케줄 실행은 30d 를, 수동 실행은 입력값을 쓴다. all 이면 필터를 꺼
          # 전체 폴더를 받는다 (백필용). 빈 문자열은 GitHub 표현식에서 falsy 라
          # 기본값으로 떨어지므로, 해제는 빈칸이 아니라 all 로 지정한다.
          MAX_AGE: ${{ github.event_name == 'workflow_dispatch' && inputs.max_age || '30d' }}
        run: |
          set -e
          # GWU.py 는 .csv 만 읽는데 폴더에는 측정마다 .fit 이 함께 있어 파일 수가
          # 두 배다. 받아봐야 쓰지 않으므로 제외한다.
          # --max-age 는 폴더 전체(2024년부터 누적)를 매번 내려받지 않게 한다.
          FILTERS=(--include '*.csv')
          if [ -n "$MAX_AGE" ] && [ "$MAX_AGE" != "all" ]; then
            FILTERS+=(--max-age "$MAX_AGE")
            echo "최근 ${MAX_AGE} 이내 CSV 만 내려받습니다."
          else
            echo "나이 필터 없음 — 전체 CSV 를 내려받습니다."
          fi
          rclone copy 'gdrive:' . --drive-export-formats csv "${FILTERS[@]}"
          echo "Workspace files:"; ls -al
          echo "CSV files:"; ls -al *.csv || true
          (ls -t *.csv 2>/dev/null | head -n 1 | xargs -I{} sh -c 'echo ">>> {}"; head -n 5 "{}"') || true

      - name: Restore Garmin token from Secret
        env:
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
        run: |
          mkdir -p ~/.garminconnect
          echo "$GARMIN_TOKEN" | base64 -d > /tmp/garmin_token.zip
          unzip -o /tmp/garmin_token.zip -d ~/.garminconnect
          echo "✅ 토큰 복원 완료"
          ls -la ~/.garminconnect

      - name: Restore Garmin token cache (~/.garminconnect)
        id: restore_token
        uses: actions/cache/restore@v4
        with:
          path: ~/.garminconnect
          key: garmin-token-v3-${{ github.run_id }}
          restore-keys: |
            garmin-token-v3-

      - name: Upload to Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SINCE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.since_days || '30' }}
        run: |
          # 로컬 garminconnect 폴더가 pip 설치 버전보다 우선되는 문제 방지
          mv garminconnect garminconnect_local_bak
          # 이미 가민에 있는 과거 기록까지 매번 재전송하면 레코드당 0.3초씩
          # 쌓여 실행이 길어지고 가민 API 도 그만큼 두드리게 된다.
          ARGS=()
          if [ -n "$SINCE_DAYS" ] && [ "$SINCE_DAYS" != "all" ]; then
            ARGS+=(--since-days "$SINCE_DAYS")
          fi
          python GWU.py "${ARGS[@]}"
          mv garminconnect_local_bak garminconnect

      - name: Save Garmin token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.garminconnect
          key: garmin-token-v3-${{ github.run_id }}
